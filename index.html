<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CodeSocial</title>
    <link rel="stylesheet" href="style.css">
    <!-- Підключаємо CodeFlask та Prism для підтримки Python і Lua -->
    <script src="https://unpkg.com/codeflask/build/codeflask.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-python.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-lua.min.js"></script>
</head>
<body>

    <header>
        <h2>CodeSocial ..</h2>
    </header>

    <main>
        <section class="create-post">
            <input type="text" id="username" placeholder="Твоє ім'я">
            
            <select id="language">
                <option value="python">Python</option>
                <option value="lua">Lua</option>
            </select>

            <div id="code-editor" style="height: 150px; border: 1px solid #45475a; border-radius: 8px; position: relative; margin-bottom: 10px; background: #181825;"></div>

            <div class="toolbar">
                <button id="btn-colon">:</button>
                <button id="btn-open-bracket">(</button>
                <button id="btn-close-bracket">)</button>
                <button id="btn-tab">Tab</button>
                <button id="btn-equals">=</button>
                <button id="btn-quote">"</button>
            </div>

            <button id="send-btn">Опублікувати</button>
        </section>

        <section id="feed">
            <h3>Стрічка дописів</h3>
            <div id="posts-container"></div>
        </section>
    </main>

    <script src="app.js"></script>
</body>
</html>
